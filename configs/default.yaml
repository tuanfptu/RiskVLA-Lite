project:
  name: RiskVLA-Lite
  seed: 42
  status: research_prototype

data:
  dataset: nexar-ai/nexar_collision_prediction
  dataset_revision: 7535d0656dac31d7da2846913bb69c6331d2a70a
  # Operator-selected root. Library code must not assume a machine path.
  root: null
  action_schema: configs/nexar_actions.yaml
  annotation_schema: data/annotations/nexar_action_schema.json
  split_policy: configs/nexar_split_policy.yaml
  split_version: not-created-v0
  cutoff:
    name: pre_event_offsets_v1
    positive_offsets_seconds: [3.0, 2.0, 1.0]
    minimum_cutoff_seconds: 0.0
    negative_policy: explicit_timestamp

vision:
  frame_count: 4
  later_frame_count: 8
  sampler: uniform
  require_pre_event: true
  max_pixels_per_frame: 50176  # 224 x 224 starting budget; processor may resize.

risk:
  provider: badas
  model_id: nexar-ai/BADAS-Open
  model_revision: 8fda93711e79d72401b0a4efc151b56455885cd2
  checkpoint_filename: weights/badas_open.pth
  source_revision: 01368cf5a164a576ae46eae3baf544e4ecdb2946
  target_fps: 8.0
  window_frames: 16
  feature_window_seconds: 2.0
  recent_peak_window_seconds: 2.0
  trigger:
    policy: risk_or_slope
    risk_threshold: 0.8
    slope_threshold: 0.15
  threshold_status: default_unvalidated
  enabled: true
  features:
    - current_risk
    - risk_slope
    - recent_peak

vla:
  model_id: Qwen/Qwen3-VL-2B-Instruct
  model_revision: main
  variant: visual_plus_temporal_risk
  precision: bf16
  device: cuda
  attention_implementation: sdpa
  do_sample: false
  num_beams: 1
  max_new_tokens: 64
  lora_status: NOT_STARTED

evaluation:
  critical_actions:
    - BRAKE_OR_STOP
  severity:
    MAINTAIN: 0
    CAUTION: 1
    SLOW: 2
    BRAKE_OR_STOP: 3
  lead_time_thresholds_seconds:
    - 0.5
    - 1.0
    - 2.0
