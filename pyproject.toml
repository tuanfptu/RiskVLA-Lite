[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskvla-lite"
version = "0.1.0"
description = "Temporal risk-conditioned lightweight VLA research infrastructure"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "RiskVLA-Lite contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10.3,<13",
  "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
inference = [
  "accelerate>=1.0,<2",
  "albumentations>=1.4,<3",
  "huggingface-hub>=0.27,<2",
  "opencv-python-headless>=4.10,<5",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "transformers>=4.57,<6",
]
train = [
  "accelerate>=1.0,<2",
  "huggingface-hub>=0.27,<2",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "transformers>=4.57,<6",
  "peft>=0.14,<1",
]
demo = [
  "plotly>=5.24,<7",
  "streamlit>=1.39,<2",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.urls]
Repository = "https://github.com/tuanfptu/RiskVLA-Lite"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["riskvla"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
